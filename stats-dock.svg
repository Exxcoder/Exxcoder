      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.25" />
    </linearGradient>
    <linearGradient id="waveGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="bar3D" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="365" height="224" rx="22" fill="url(#cardGlass)" stroke="url(#cardBorder)" stroke-width="1.3" />
  <text x="28" y="38" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="600">GitHub Stats</text>
  <circle cx="75" cy="120" r="40" fill="none" stroke="#21262d" stroke-width="5" />
  <circle cx="75" cy="120" r="40" fill="none" stroke="#ffffff" stroke-width="5" stroke-dasharray="180" stroke-dashoffset="65" stroke-linecap="round" />
  <text x="75" y="123" fill="#ffffff" font-family="sans-serif" font-size="19" font-weight="700" text-anchor="middle">55%</text>
  <text x="75" y="139" fill="#8b949e" font-family="sans-serif" font-size="10" text-anchor="middle">Score</text>
  <path d="M 140 145 Q 170 85, 200 135 T 260 100 T 310 130 T 345 85" fill="none" stroke="url(#waveGlow)" stroke-width="2.6" />
  <circle cx="260" cy="100" r="4" fill="#ffffff" />
  <line x1="260" y1="100" x2="260" y2="155" stroke="#ffffff" stroke-dasharray="2 3" opacity="0.3" />
  <text x="270" y="98" fill="#c9d1d9" font-family="sans-serif" font-size="11">Peak: 22.9%</text>
  <text x="28" y="198" fill="#6e7681" font-family="sans-serif" font-size="11">Диаграммы: 1.76%</text>

  <rect x="391" y="2" width="365" height="224" rx="22" fill="url(#cardGlass)" stroke="url(#cardBorder)" stroke-width="1.3" />
  <text x="417" y="38" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="600">Top Languages</text>
  <circle cx="423" cy="80" r="3.5" fill="#ffffff" /><text x="438" y="84" fill="#c9d1d9" font-family="sans-serif" font-size="12">Languages</text><text x="515" y="84" fill="#8b949e" font-family="sans-serif" font-size="12">47.5%</text>
  <circle cx="423" cy="110" r="3.5" fill="#8b949e" /><text x="438" y="114" fill="#c9d1d9" font-family="sans-serif" font-size="12">Python</text><text x="515" y="114" fill="#8b949e" font-family="sans-serif" font-size="12">15.2%</text>
  <circle cx="423" cy="140" r="3.5" fill="#6e7681" /><text x="438" y="144" fill="#c9d1d9" font-family="sans-serif" font-size="12">C# / .NET</text><text x="515" y="144" fill="#8b949e" font-family="sans-serif" font-size="12">6.3%</text>
  <circle cx="423" cy="170" r="3.5" fill="#484f58" /><text x="438" y="174" fill="#c9d1d9" font-family="sans-serif" font-size="12">Web Core</text><text x="515" y="174" fill="#8b949e" font-family="sans-serif" font-size="12">13.7%</text>

