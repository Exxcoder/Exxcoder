<svg xmlns="http://www.w3.org/2000/svg" width="800" height="230" viewBox="0 0 800 230">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="glowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <rect x="10" y="10" width="375" height="210" rx="20" fill="url(#cardBg)" stroke="url(#borderGrad)" stroke-width="1.2" />
  <text x="35" y="45" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="600">GitHub Stats</text>
  
  <circle cx="85" cy="125" r="42" fill="none" stroke="#21262d" stroke-width="6" />
  <circle cx="85" cy="125" r="42" fill="none" stroke="#ffffff" stroke-width="6" stroke-dasharray="190" stroke-dashoffset="65" stroke-linecap="round" />
  <text x="85" y="125" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="700" text-anchor="middle">55%</text>
  <text x="85" y="142" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" text-anchor="middle">Score</text>

  <path d="M 155 135 Q 185 85, 215 135 T 275 110 T 335 125 T 360 90" fill="none" stroke="url(#glowLine)" stroke-width="2.5" />
  <circle cx="275" cy="110" r="4" fill="#ffffff" />
  <line x1="275" y1="110" x2="275" y2="155" stroke="#ffffff" stroke-dasharray="2 3" opacity="0.4" />
  <text x="285" y="105" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11">Peak: 22.9%</text>
  <text x="35" y="195" fill="#6e7681" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11">Диаграммы: 1.76%</text>

  <rect x="415" y="10" width="375" height="210" rx="20" fill="url(#cardBg)" stroke="url(#borderGrad)" stroke-width="1.2" />
  <text x="440" y="45" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="600">Top Languages</text>

  <circle cx="445" cy="85" r="4" fill="#ffffff" />
  <text x="460" y="89" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">Languages</text>
  <text x="560" y="89" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">47.5%</text>

  <circle cx="445" cy="115" r="4" fill="#8b949e" />
  <text x="460" y="119" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">JavaScript / TS</text>
  <text x="560" y="119" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">28.4%</text>

  <circle cx="445" cy="145" r="4" fill="#484f58" />
  <text x="460" y="149" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">C# / Backend</text>
  <text x="560" y="149" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">15.2%</text>

  <g opacity="0.85">
