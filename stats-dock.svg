    <rect x="680" y="105" width="22" height="70" rx="4" fill="#ffffff" fill-opacity="0.35" stroke="url(#borderGrad)" />
    <rect x="710" y="120" width="22" height="55" rx="4" fill="#ffffff" fill-opacity="0.25" stroke="url(#borderGrad)" />
    <rect x="740" y="145" width="22" height="30" rx="4" fill="#ffffff" fill-opacity="0.15" stroke="url(#borderGrad)" />
