      <circle cx="498" cy="122" r="3" /><circle cx="554" cy="122" r="3" />
      <circle cx="498" cy="136" r="3" /><circle cx="512" cy="136" r="3" /><circle cx="526" cy="136" r="3" /><circle cx="540" cy="136" r="3" />
