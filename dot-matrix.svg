<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 176" width="100%">
  <defs>
    <style>
      .bg-grid {
        fill: url(#dotPattern);
      }
      .dot {
        fill: #21262d;
        opacity: 0.3;
        animation: neonScan 3.6s infinite ease-in-out;
      }
      /* Задержки по буквам для создания непрерывной волны */
      .l1 { animation-delay: 0.0s; }
      .l2 { animation-delay: 0.22s; }
      .l3 { animation-delay: 0.44s; }
      .l4 { animation-delay: 0.66s; }
      .l5 { animation-delay: 0.88s; }
      .l6 { animation-delay: 1.10s; }
      .l7 { animation-delay: 1.32s; }
      .l8 { animation-delay: 1.54s; }

      @keyframes neonScan {
        0%, 100% {
          fill: #21262d;
          opacity: 0.3;
          filter: none;
        }
        30%, 55% {
          fill: #ffffff;
          opacity: 1;
          filter: drop-shadow(0 0 4px #ffffff) drop-shadow(0 0 9px rgba(255, 255, 255, 0.75));
        }
      }
    </style>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.22" />
    </linearGradient>

    <pattern id="dotPattern" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="1.3" fill="#21262d" opacity="0.45" />
    </pattern>
  </defs>

  <rect x="2" y="2" width="796" height="172" rx="22" fill="url(#cardBg)" stroke="url(#cardBorder)" stroke-width="1.3" />

  <text x="32" y="29" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="11" font-weight="600" letter-spacing="2">MATRIX // NEON SCANNER</text>
  <text x="736" y="29" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="10" font-weight="600" letter-spacing="1" text-anchor="end">SCANNING ACTIVE</text>
  <circle cx="750" cy="26" r="3.5" fill="#3fb950" />

  <rect x="20" y="40" width="760" height="114" rx="12" class="bg-grid" />

  <g>
    <g class="dot l1">
      <circle cx="78" cy="52" r="3" /><circle cx="92" cy="52" r="3" /><circle cx="106" cy="52" r="3" /><circle cx="120" cy="52" r="3" /><circle cx="134" cy="52" r="3" />
      <circle cx="78" cy="66" r="3" />
      <circle cx="78" cy="80" r="3" />
      <circle cx="78" cy="94" r="3" /><circle cx="92" cy="94" r="3" /><circle cx="106" cy="94" r="3" /><circle cx="120" cy="94" r="3" />
      <circle cx="78" cy="108" r="3" />
      <circle cx="78" cy="122" r="3" />
      <circle cx="78" cy="136" r="3" /><circle cx="92" cy="136" r="3" /><circle cx="106" cy="136" r="3" /><circle cx="120" cy="136" r="3" /><circle cx="134" cy="136" r="3" />
