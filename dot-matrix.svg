      <circle cx="162" cy="52" r="3" /><circle cx="218" cy="52" r="3" />
      <circle cx="176" cy="66" r="3" /><circle cx="204" cy="66" r="3" />
      <circle cx="176" cy="80" r="3" /><circle cx="204" cy="80" r="3" />
